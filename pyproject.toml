[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-transcriber-2026"
version = "1.0.0"
description = "Complete Indian music transcription with raga, tala, ornament detection, and source separation"
authors = [{name = "Bhupender", email = "bhup2a1n@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = ["music", "transcription", "raga", "tala", "indian-music", "source-separation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

# Core dependencies optimized for Python 3.13
dependencies = [
    # Audio Processing
    "librosa>=0.11.0",
    "soundfile>=0.13.0",
    "audioread>=3.1.0",
    
    # Deep Learning (Latest PyTorch - Python 3.13 compatible)
    "torch>=2.4.1",
    "torchaudio>=2.4.1",
    "torchvision>=0.19.1",
    
    # Music Analysis & Separation
    "demucs>=4.0.0",
    "numpy>=2.2.0",
    "scipy>=1.15.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.6.0",
    "mir_eval>=0.8.0",
    "python-speech-features>=0.6",
    
    # Visualization
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "plotly>=5.25.0",
    
    # Web Framework
    "flask>=3.1.0",
    "flask-cors>=5.0.0",
    "flask-socketio>=5.4.0",
    "gunicorn>=23.0.0",
    "python-socketio>=5.11.0",
    "python-engineio>=4.11.0",
    
    # Configuration & Utils
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.1",
    "pydub>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "black>=24.10.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "jupyter>=1.0.0",
    "ipython>=8.29.0",
]

music = [
    # Optional: Enhanced music analysis (if available for Python 3.13)
    # "essentia>=2.1.0",
    # "mir_eval>=0.8.0",
]

gpu = [
    # For GPU support (CUDA 11.8+)
    # torch and torchaudio already included in main dependencies
    # User should install: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
]

[project.urls]
Homepage = "https://github.com/yourusername/music-transcriber-2026"
Documentation = "https://github.com/yourusername/music-transcriber-2026/wiki"
Repository = "https://github.com/yourusername/music-transcriber-2026.git"
Issues = "https://github.com/yourusername/music-transcriber-2026/issues"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py313"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "E203",  # whitespace before ':'
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
pretty = true

[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "torch.*",
    "sklearn.*",
    "plotly.*",
    "flask.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
